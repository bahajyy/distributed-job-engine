server:
  port: 8081

spring:
  application:
    name: producer-api

  datasource:
    # ${VAR:default} — reads from environment variable, falls back to default for local dev
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobengine}
    username: ${DB_USER:jobengine}
    password: ${DB_PASSWORD:jobengine}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # creates or updates the schema on startup — use validate in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics # exposes /actuator/health for Docker and Kubernetes probes
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.jobengine: DEBUG
    org.springframework.kafka: INFO
